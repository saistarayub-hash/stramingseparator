name: ops-diag
on:
  push:
    paths: ['cloud-probe/diag.txt']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: report which secrets exist (lengths only)
        env:
          A: ${{ secrets.RENDER_API_KEY }}
          B: ${{ secrets.RENDER_KEY }}
          C: ${{ secrets.RENDER }}
          D: ${{ secrets.APPWRITE_API_KEY }}
          E: ${{ secrets.APPWRITE_PROJECT_ID }}
          V: ${{ vars.RENDER_API_KEY }}
        run: |
          L(){ printf '%s' "$1" | wc -c; }
          {
            echo "# diag $(date -u +%FT%TZ) runner=$(whoami) repo=${{ github.repository }} secret-context=repository"
            echo "secrets.RENDER_API_KEY     len=$(L "$A")"
            echo "secrets.RENDER_KEY         len=$(L "$B")"
            echo "secrets.RENDER             len=$(L "$C")"
            echo "secrets.APPWRITE_API_KEY   len=$(L "$D")"
            echo "secrets.APPWRITE_PROJECT_ID len=$(L "$E")"
            echo "vars.RENDER_API_KEY        len=$(L "$V")"
            echo "---liveapp---"
            curl -sS -m 20 https://streampilot-ttus.onrender.com/api/cloud/status || echo "LIVE APP UNREACHABLE"
          } | tee cloud-probe/diag.txt
      - name: commit
        run: |
          git config user.name streampilot-bot
          git config user.email bot@users.noreply.github.com
          git add cloud-probe/diag.txt
          git commit -m "chore: diag $(date -u +%FT%TZ)" || echo none
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo PUSH-DENIED
        env:
          GH_TOKEN: ${{ github.token }}
