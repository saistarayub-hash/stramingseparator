name: remote-hands
on:
  push:
    paths: ['cloud-probe/trigger.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reachability + echo
        run: |
          {
            echo "# remote-hands probe $(date -u +%FT%TZ)"
            echo "token-present: $([ -n \"\$GH_TOKEN\" ] && echo yes || echo no)"
            for h in https://nyc.cloud.appwrite.io/v1/ping https://streampilot-ttus.onrender.com/api/status https://api.render.com/v1/owners; do
              printf '%s -> ' "$h"
              curl -sS -m 20 -o /dev/null -w '%{http_code}\n' "$h" 2>&1 || echo BLOCKED
            done
          } | tee cloud-probe/result.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: commit results back
        run: |
          git config user.name  "streampilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cloud-probe/result.txt
          git commit -m "chore: remote-hands probe results" || echo "nothing to commit"
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo "PUSH DENIED"
        env:
          GH_TOKEN: ${{ github.token }}
