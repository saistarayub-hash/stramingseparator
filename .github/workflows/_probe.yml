name: connectivity-probe
on:
  push:
    paths: ['.github/workflows/_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: echo marker
        run: echo "MARKER_7249 hello from runner"
      - name: reach out
        run: |
          echo -n "appwrite: " && curl -sS -m 20 -o /dev/null -w "%{http_code}\n" https://nyc.cloud.appwrite.io/v1/ping || echo "appwrite BLOCKED"
          echo -n "render:   " && curl -sS -m 20 -o /dev/null -w "%{http_code}\n" https://streampilot-ttus.onrender.com/api/status || echo "render BLOCKED"
