# "Remote hands" jobs — run on a GitHub machine that CAN reach Appwrite/Render,
# then commit the report back to this repo so the agent (which can't reach those
# hosts directly) can read it.
name: remote-hands
on:
  workflow_dispatch:
    inputs:
      run:
        description: 'what to run: probe | scopes'
        required: true
        default: 'probe'
  push:
    paths: ['cloud-probe/trigger.txt']

permissions:
  contents: write

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: reachability probe
        if: github.event.inputs.run == 'probe' || github.event_name == 'push'
        run: |
          {
            echo "# remote-hands probe $(date -u +%FT%TZ)"
            for h in \
              "https://nyc.cloud.appwrite.io/v1/ping" \
              "https://streampilot-ttus.onrender.com/api/status" \
              "https://streampilot-ttus.onrender.com/api/cloud/status" \
            ; do
              printf '%s -> ' "$h"
              curl -sS -m 20 -w ' [%{http_code}]\n' "$h" 2>&1 | tr '\n' ' ' | cut -c1-180
              echo
            done
          } | tee cloud-probe/result.txt

      - name: scope probe (key from GitHub secret)
        if: github.event.inputs.run == 'scopes'
        run: |
          if [ -z "${{ secrets.APPWRITE_API_KEY }}" ]; then
            echo "NO KEY IN SECRET APPWRITE_API_KEY" | tee cloud-probe/result.txt
          else
            set -a
            APPWRITE_ENDPOINT="https://nyc.cloud.appwrite.io/v1"
            APPWRITE_PROJECT_ID="${{ secrets.APPWRITE_PROJECT_ID }}"
            APPWRITE_API_KEY="${{ secrets.APPWRITE_API_KEY }}"
            set +a
            node scripts/remotescopes.mjs 2>&1 | tee cloud-probe/result.txt
          fi

      - name: commit report back
        run: |
          git config user.name  "streampilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cloud-probe/result.txt
          git commit -m "chore: remote-hands report $(date -u +%FT%TZ)" || echo "nothing new"
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo "PUSH DENIED"
        env:
          GH_TOKEN: ${{ github.token }}
