# Drive Render (repo secret RENDER_API_KEY) — commits report back.
name: ops-render
on:
  push:
    paths: ['cloud-probe/render.txt']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run render ops
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/remoteops.mjs 2>&1 | tee cloud-probe/render.txt
      - name: commit
        run: |
          git config user.name streampilot-bot
          git config user.email bot@users.noreply.github.com
          git add cloud-probe/render.txt cloud-probe/report.json
          git commit -m "chore: render ops $(date -u +%FT%TZ)" || echo none
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo PUSH-DENIED
        env:
          GH_TOKEN: ${{ github.token }}
