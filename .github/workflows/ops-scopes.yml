# Appwrite scope probe (uses repo secrets) — commits report back.
name: ops-scopes
on:
  push:
    paths: ['cloud-probe/scopes.txt']
permissions:
  contents: write
jobs:
  scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run scope probe
        env:
          APPWRITE_ENDPOINT: https://nyc.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/remotescopes.mjs 2>&1 | tee cloud-probe/scopes.txt
      - name: commit
        run: |
          git config user.name streampilot-bot
          git config user.email bot@users.noreply.github.com
          git add cloud-probe/scopes.txt
          git commit -m "chore: scope probe $(date -u +%FT%TZ)" || echo none
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo PUSH-DENIED
        env:
          GH_TOKEN: ${{ github.token }}
