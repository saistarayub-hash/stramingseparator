# End-to-end smoke test against the LIVE app, two ways to fire it:
#   • push & change cloud-probe/smoke.trigger.txt  (automated)
#   • Run → Actions → "End-to-end smoke test" → "Run workflow"  (one-click, UI)
# Commits a secret-free report to cloud-probe/smoketest.txt + report.json.
name: end-to-end-smoke-test
on:
  push:
    paths: ['cloud-probe/smoke.trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run smoke test
        run: node scripts/smoketest.mjs 2>&1 | tee cloud-probe/smoketest.txt
      - name: commit report
        run: |
          git config user.name streampilot-bot
          git config user.email bot@users.noreply.github.com
          git add cloud-probe/smoketest.txt cloud-probe/report.json
          git commit -m "chore: smoke test $(date -u +%FT%TZ)" || echo none
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo PUSH-DENIED
        env:
          GH_TOKEN: ${{ github.token }}
