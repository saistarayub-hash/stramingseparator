# StreamPilot end-to-end smoke test — runs against the LIVE app from a runner.
# Trigger: push any change to cloud-probe/smoke.trigger.txt. Commits the
# secret-free report back to cloud-probe/smoketest.txt + report.json.
name: ops-smoke
on:
  push:
    paths: ['cloud-probe/smoke.trigger.txt']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run end-to-end smoke test
        run: node scripts/smoketest.mjs 2>&1 | tee cloud-probe/smoketest.txt
      - name: commit report
        run: |
          git config user.name streampilot-bot
          git config user.email bot@users.noreply.github.com
          git add cloud-probe/smoketest.txt cloud-probe/report.json
          git commit -m "chore: smoke test $(date -u +%FT%TZ)" || echo none
          git push origin HEAD:arena/01a0ba1a-stramingseparator || echo PUSH-DENIED
        env:
          GH_TOKEN: ${{ github.token }}
